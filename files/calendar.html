<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Compass - Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Calendar View</h1>
            <p class="user-greeting" id="userGreeting">Your goals timeline</p>
        </div>

        <div class="calendar-section">
            <div class="calendar-header">
                <h2 class="calendar-title">Goal Calendar</h2>
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">← Previous</button>
                    <div class="current-month" id="currentMonth">Loading...</div>
                    <button class="nav-btn" onclick="changeMonth(1)">Next →</button>
                </div>
            </div>

            <div class="calendar-grid" id="calendarGrid">
                <div class="calendar-day-header">Sun</div>
                <div class="calendar-day-header">Mon</div>
                <div class="calendar-day-header">Tue</div>
                <div class="calendar-day-header">Wed</div>
                <div class="calendar-day-header">Thu</div>
                <div class="calendar-day-header">Fri</div>
                <div class="calendar-day-header">Sat</div>
                <!-- Days should be populated dynamically by JS below -->
            </div>
        </div>

        <div class="upcoming-section">
            <h2>Upcoming Deadlines</h2>
            <div class="upcoming-list" id="upcomingList">
            </div>
        </div>
    </div>

    <script>
        let goals = [];
        let currentDate = new Date();

        async function loadGoals() {
            await auth.requireAuth();
            const savedGoals = await db.getItem('lifeAuditGoals');
            goals = savedGoals || [];
            
            // part should filter only goals with deadlines
            goals = goals.filter(g => g.deadline);
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 'YYYY-MM-DD' -> local midnight (new Date('YYYY-MM-DD') is UTC midnight)
        function parseLocalDate(value) {
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(value || '');
            return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(value);
        }

        function changeMonth(delta) {
            // Pin to the 1st first: setMonth on the 29th-31st can overflow and skip a month
            currentDate.setDate(1);
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Update header
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                              'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
            
            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            const grid = document.getElementById('calendarGrid');
            
            // Clear existing days (keep headers)
            while (grid.children.length > 7) {
                grid.removeChild(grid.lastChild);
            }
            
            const today = new Date();
            
            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const dayDiv = createDayElement(day, month - 1, year, true);
                grid.appendChild(dayDiv);
            }
            
            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = day === today.getDate() && 
                               month === today.getMonth() && 
                               year === today.getFullYear();
                const dayDiv = createDayElement(day, month, year, false, isToday);
                grid.appendChild(dayDiv);
            }
            
            // Next month days
            const totalCells = grid.children.length - 7;
            const remainingCells = 42 - totalCells;
            for (let day = 1; day <= remainingCells; day++) {
                const dayDiv = createDayElement(day, month + 1, year, true);
                grid.appendChild(dayDiv);
            }
        }

        // FUNCTION: Create day element
        function createDayElement(day, month, year, otherMonth = false, isToday = false) {
            const dayDiv = document.createElement('div');
            dayDiv.className = `calendar-day ${otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;
            
            const dayDate = new Date(year, month, day);
            // Build the key from local parts; toISOString() converts to UTC and is a day early in UTC+3
            const dateStr = `${dayDate.getFullYear()}-${String(dayDate.getMonth() + 1).padStart(2, '0')}-${String(dayDate.getDate()).padStart(2, '0')}`;
            
            // Find goals for this date
            const dayGoals = goals.filter(g => {
                if (!g.deadline) return false;
                const goalDate = g.deadline.split('T')[0];
                return goalDate === dateStr;
            });
            
            // Check if any goals are overdue
            const hasOverdue = dayGoals.some(g => {
                const deadline = parseLocalDate(g.deadline);
                const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
                return !g.completed && deadline < startOfToday;
            });
            
            dayDiv.innerHTML = `
                <div class="day-number">${day}</div>
                <div class="day-goals">
                    ${dayGoals.map(goal => `
                        <div class="calendar-goal ${goal.category} ${hasOverdue && !goal.completed ? 'overdue' : ''}" 
                             title="${escapeHtml(goal.title)}">${goal.completed ? '✓ ' : ''}${escapeHtml(goal.title)}</div>
                    `).join('')}
                </div>
            `;
            
            return dayDiv;
        }

        // Render upcoming goals
        function renderUpcoming() {
            const list = document.getElementById('upcomingList');
            list.innerHTML = '';
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // Sort goals by deadline
            const sortedGoals = [...goals]
                .filter(g => !g.completed)
                .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
            
            if (sortedGoals.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #999; padding: 40px;">No upcoming deadlines</div>';
                return;
            }
            
            sortedGoals.forEach(goal => {
                const deadline = parseLocalDate(goal.deadline);
                const daysUntil = Math.round((deadline - today) / 86400000);
                const dayWord = n => (n === 1 ? 'day' : 'days');
                
                let statusClass = '';
                let statusText = '';
                let itemClass = '';
                
                if (daysUntil < 0) {
                    statusClass = 'status-overdue';
                    statusText = `Overdue by ${Math.abs(daysUntil)} ${dayWord(Math.abs(daysUntil))}`;
                    itemClass = 'overdue';
                } else if (daysUntil === 0) {
                    statusClass = 'status-today';
                    statusText = 'Due TODAY!';
                    itemClass = 'due-soon';
                } else if (daysUntil <= 7) {
                    statusClass = 'status-soon';
                    statusText = `Due in ${daysUntil} ${dayWord(daysUntil)}`;
                    itemClass = 'due-soon';
                } else {
                    statusClass = 'status-soon';
                    statusText = deadline.toLocaleDateString();
                }
                
                const item = document.createElement('div');
                item.className = `upcoming-goal ${itemClass}`;
                item.innerHTML = `
                    <div class="upcoming-goal-content">
                        <div class="upcoming-goal-title">${escapeHtml(goal.title)}</div>
                        <div class="upcoming-goal-meta">${getCategoryName(goal.category)}</div>
                    </div>
                    <div class="upcoming-goal-status ${statusClass}">${statusText}</div>
                `;
                
                list.appendChild(item);
            });
        }

        function getCategoryName(category) {
            const names = {
                career: 'Career',
                health: 'Health',
                finance: 'Finance',
                relationships: 'Relationships',
                hobbies: 'Hobbies'
            };
            return names[category] || category;
        }

        window.addEventListener('load', async function() {
            await loadGoals();
            renderCalendar();
            renderUpcoming();
        });
    </script>
    <script src="supabase-client.js"></script>
    <script src="db.js"></script>
    <script src="nav.js"></script>
</body>
</html>
