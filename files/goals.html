<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Compass-My Goals</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Goals</h1>
            <p class="user-greeting" id="userGreeting">Loading...</p>
        </div>

        <div class="stats-summary">
            <div class="stat-card">
                <div class="stat-number" id="totalGoals">0</div>
                <div class="stat-label">Total Goals</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedGoals">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingGoals">0</div>
                <div class="stat-label">In Progress</div>
            </div>
        </div>

        <div class="add-goal-section">
            <h2>Add New Goal</h2>
            <form id="goalForm" class="goal-form">
                <input 
                    type="text" 
                    id="goalTitle" 
                    placeholder="Goal title (e.g., Learn Python)" 
                    required
                >
                <textarea 
                    id="goalDescription" 
                    placeholder="Description (optional): Add details about this goal..."
                ></textarea>
                <div class="form-row">
                    <select id="goalCategory" required>
                        <option value="">Select Category...</option>
                        <option value="career">Career/Education</option>
                        <option value="health">Health & Fitness</option>
                        <option value="finance">Finance</option>
                        <option value="relationships">Relationships/Social</option>
                        <option value="hobbies">Skills/Hobbies</option>
                    </select>
                    <input 
                        type="text" 
                        id="goalDeadline" 
                        placeholder="DD/MM/YYYY (optional)"
                        pattern="\d{2}/\d{2}/\d{4}"
                        title="Please enter date in DD/MM/YYYY format"
                    >
                </div>
                <div class="form-row">
                    <div style="flex: 1;"></div>
                    <button type="submit" class="btn btn-primary">Add Goal</button>
                </div>
            </form>
        </div>

        <!-- Goals Display by Category -->
        <div class="goals-container" id="goalsContainer">
            <!-- JavaScript will do its thing -->
        </div>
    </div>

    <script>
        const CATEGORIES = {
            career: {
                name: 'Career/Education',
                color: 'career'
            },
            health: {
                name: 'Health & Fitness',
                color: 'health'
            },
            finance: {
                name: 'Finance',
                color: 'finance'
            },
            relationships: {
                name: 'Relationships/Social',
                color: 'relationships'
            },
            hobbies: {
                name: 'Skills/Hobbies',
                color: 'hobbies'
            }
        };

        // Store all goals array
        let goals = [];

        // Found section of code that allows date to be formatted in the form DD/MM/YYYY
        function formatDateDDMMYYYY(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Achievement definitions (for XP calculation)
        const ACHIEVEMENTS = [
            { id: 'first_goal', requirement: (stats) => stats.totalGoals >= 1, xp: 50 },
            { id: 'goal_getter', requirement: (stats) => stats.totalGoals >= 5, xp: 100 },
            { id: 'ambitious', requirement: (stats) => stats.totalGoals >= 10, xp: 200 },
            { id: 'first_win', requirement: (stats) => stats.completedGoals >= 1, xp: 100 },
            { id: 'on_fire', requirement: (stats) => stats.completedGoals >= 5, xp: 250 },
            { id: 'unstoppable', requirement: (stats) => stats.completedGoals >= 10, xp: 500 },
            { id: 'well_rounded', requirement: (stats) => stats.categoriesUsed >= 5, xp: 300 },
            { id: 'perfectionist', requirement: (stats) => stats.categoryCompleted, xp: 400 }
        ];

        let gamificationData = {
            totalXP: 0,
            unlockedAchievements: [],
            streak: 0,
            lastActiveDate: null
        };

        // FUNCTION 1: Load user profile, should also show dynamic greeting from provided set
        async function loadUserProfile() {
            const savedProfile = await db.getItem('lifeAuditProfile');
            
            if (savedProfile) {
                const profile = savedProfile;
                document.getElementById('userGreeting').textContent = 
                    `Welcome, ${profile.name}! Let's organize your goals.`;
            } else {
                document.getElementById('userGreeting').textContent = 
                    'Start by creating your first goal below!';
            }
        }

        // FUNCTION 2: Load saved goals from Supabase
        async function loadGoals() {
            await auth.requireAuth();
            const savedGoals = await db.getItem('lifeAuditGoals');
            
            goals = savedGoals || [];
            
            displayGoals();
            updateStats();
        }

        // FUNCTION 3: Save goals to Supabase
        async function saveGoals() {
            await db.setItem('lifeAuditGoals', goals);
        }

        // FUNCTION 4: Add a new goal
        document.getElementById('goalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Get form values
            const title = document.getElementById('goalTitle').value;
            const category = document.getElementById('goalCategory').value;
            const description = document.getElementById('goalDescription').value;
            const deadlineInput = document.getElementById('goalDeadline').value;
            
            // Convert DD/MM/YYYY to ISO format (YYYY-MM-DD)
            let deadline = null;
            if (deadlineInput) {
                const parts = deadlineInput.split('/');
                if (parts.length === 3) {
                    const day = parts[0];
                    const month = parts[1];
                    const year = parts[2];
                    deadline = `${year}-${month}-${day}`;
                    
                    // Validate the date
                    const dateObj = new Date(deadline);
                    if (isNaN(dateObj.getTime())) {
                        alert('Invalid date format! Please use DD/MM/YYYY');
                        return;
                    }
                }
            }
            
            // Create new goal object
            const newGoal = {
                id: Date.now(), // Will create a timestamp based unique ID probably. I hope.
                title: title,
                category: category,
                description: description,
                deadline: deadline,
                completed: false,
                createdAt: new Date().toISOString(),
                completedAt: null
            };
            
            // Add to goals array
            goals.push(newGoal);
            
            // Save and refresh display
            await saveGoals();
            displayGoals();
            updateStats();
            
            // Clear the form
            document.getElementById('goalForm').reset();
            
            console.log('Goal added:', newGoal);
        });

        // FUNCTION 5: Display all goals organized by category
        function displayGoals() {
            const container = document.getElementById('goalsContainer');
            container.innerHTML = ''; // Clear existing content
            
            // Loop through each category
            Object.keys(CATEGORIES).forEach(categoryKey => {
                const category = CATEGORIES[categoryKey];
                
                // Filter goals for this category
                const categoryGoals = goals.filter(goal => goal.category === categoryKey);
                
                // Create category section
                const section = document.createElement('div');
                section.className = 'category-section';
                
                // Count completed vs total
                const completedCount = categoryGoals.filter(g => g.completed).length;
                const totalCount = categoryGoals.length;
                
                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-icon"></div>
                        <div class="category-title">
                            <h3>${category.name}</h3>
                            <div class="category-count">${completedCount} of ${totalCount} completed</div>
                        </div>
                        <span class="category-badge category-${category.color}">${totalCount}</span>
                    </div>
                    <div class="goals-list" id="goals-${categoryKey}"></div>
                `;
                
                container.appendChild(section);
                
                // Add goals to this category
                const goalsList = document.getElementById(`goals-${categoryKey}`);
                
                if (categoryGoals.length === 0) {
                    goalsList.innerHTML = `
                        <div class="empty-state">
                            <div>No goals in this category yet</div>
                        </div>
                    `;
                } else {
                    categoryGoals.forEach(goal => {
                        goalsList.appendChild(createGoalElement(goal));
                    });
                }
            });
        }

        // FUNCTION 6: Create a single goal element
        function createGoalElement(goal) {
            const goalDiv = document.createElement('div');
            goalDiv.className = `goal-item ${goal.completed ? 'completed' : ''}`;
            
            // Format the creation date as DD/MM/YYYY
            const dateStr = formatDateDDMMYYYY(goal.createdAt);
            
            // Check deadline status
            let deadlineHTML = '';
            let deadlineClass = '';
            if (goal.deadline) {
                const deadline = new Date(goal.deadline);
                const today = new Date();
                const daysUntil = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
                
                if (!goal.completed) {
                    if (daysUntil < 0) {
                        deadlineClass = 'overdue';
                        deadlineHTML = `<span style="color: #ef4444; font-weight: 600;">Overdue by ${Math.abs(daysUntil)} days</span>`;
                    } else if (daysUntil === 0) {
                        deadlineClass = 'due-today';
                        deadlineHTML = `<span style="color: #f59e0b; font-weight: 600;">Due TODAY!</span>`;
                    } else if (daysUntil <= 7) {
                        deadlineClass = 'due-soon';
                        deadlineHTML = `<span style="color: #f59e0b; font-weight: 600;">Due in ${daysUntil} days</span>`;
                    } else {
                        deadlineHTML = `<span style="color: #666;">Due ${formatDateDDMMYYYY(goal.deadline)}</span>`;
                    }
                } else {
                    deadlineHTML = `<span style="color: #666;">Completed ${goal.completedAt ? formatDateDDMMYYYY(goal.completedAt) : ''}</span>`;
                }
            }
            
            goalDiv.innerHTML = `
                <input 
                    type="checkbox" 
                    class="goal-checkbox" 
                    ${goal.completed ? 'checked' : ''}
                    onchange="toggleGoal(${goal.id})"
                >
                <div class="goal-content">
                    <div class="goal-text">${goal.title}</div>
                    ${goal.description ? `<div class="goal-description">${goal.description}</div>` : ''}
                    <div class="goal-meta">
                        <span class="goal-date">Added ${dateStr}</span>
                        ${deadlineHTML ? `<span class="goal-deadline">${deadlineHTML}</span>` : ''}
                    </div>
                </div>
                <div class="goal-actions">
                    <button class="icon-btn" onclick="deleteGoal(${goal.id})" title="Delete">🗑️</button>
                </div>
            `;
            
            return goalDiv;
        }

        // FUNCTION 7: Toggle goal completion 
        async function toggleGoal(goalId) {
            const goal = goals.find(g => g.id === goalId);
            if (goal) {
                const wasCompleted = goal.completed;
                goal.completed = !goal.completed;
                
                // Award XP upon completion of a goal
                if (goal.completed && !wasCompleted) {
                    goal.completedAt = new Date().toISOString();
                    await awardXP(50, `Completed: ${goal.title}`);
                } else if (!goal.completed && wasCompleted) {
                    // Remove XP if unchecking a completed goal
                    goal.completedAt = null;
                }
                
                await saveGoals();
                displayGoals();
                updateStats();
            }
        }

        // FUNCTIOn to Award XP and update gamification
        async function awardXP(amount, reason) {
            // Load gamification data
            let savedGamification = await db.getItem('lifeAuditGamification');
            let data = savedGamification || {
                totalXP: 0,
                unlockedAchievements: [],
                streak: 0,
                lastActiveDate: null
            };
            
            // Add XP
            data.totalXP += amount;
            
            // Save
            await db.setItem('lifeAuditGamification', data);
            
            // Show notification
            showXPNotification(amount, reason);
        }

        // FUNCTION TO Show XP notification
        function showXPNotification(amount, reason) {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--black);
                color: white;
                padding: 20px 30px;
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                z-index: 10000;
                animation: slideIn 0.5s;
                font-weight: 600;
            `;
            notification.innerHTML = `
                <div style="font-size: 24px; margin-bottom: 5px;">+${amount} XP!</div>
                <div style="font-size: 14px; opacity: 0.9;">${reason}</div>
            `;
            
            document.body.appendChild(notification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.5s';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(400px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(400px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // FUNCTION 8: Goal deletion function
        async function deleteGoal(goalId) {
            if (confirm('Are you sure you want to delete this goal?')) {
                goals = goals.filter(g => g.id !== goalId);
                await saveGoals();
                displayGoals();
                updateStats();
            }
        }

        // FUNCTION 9: Update statistics
        function updateStats() {
            const total = goals.length;
            const completed = goals.filter(g => g.completed).length;
            const pending = total - completed;
            
            document.getElementById('totalGoals').textContent = total;
            document.getElementById('completedGoals').textContent = completed;
            document.getElementById('pendingGoals').textContent = pending;
        }

        // Run when page loads
        window.addEventListener('load', async function() {
            await loadUserProfile();
            await loadGoals();
            
            // Add date input auto-formatting (DD/MM/YYYY)
            const deadlineInput = document.getElementById('goalDeadline');
            deadlineInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
                
                if (value.length >= 2) {
                    value = value.substring(0, 2) + '/' + value.substring(2);
                }
                if (value.length >= 5) {
                    value = value.substring(0, 5) + '/' + value.substring(5, 9);
                }
                
                e.target.value = value;
            });
        });
    </script>
    <script src="supabase-client.js"></script>
    <script src="db.js"></script>
    <script src="nav.js"></script>
</body>
</html>
