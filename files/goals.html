<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Compass-My Goals</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Goals</h1>
            <p class="user-greeting" id="userGreeting">Loading...</p>
        </div>

        <div class="stats-summary">
            <div class="stat-card">
                <div class="stat-number" id="totalGoals">0</div>
                <div class="stat-label">Total Goals</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedGoals">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingGoals">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="allTimeCompleted">0</div>
                <div class="stat-label">All-time Completed</div>
            </div>
        </div>

        <div class="add-goal-section">
            <h2>Add New Goal</h2>
            <form id="goalForm" class="goal-form">
                <input 
                    type="text" 
                    id="goalTitle" 
                    placeholder="Goal title (e.g., Learn Python)" 
                    required
                >
                <textarea 
                    id="goalDescription" 
                    placeholder="Description (optional): Add details about this goal..."
                ></textarea>
                <div class="form-row">
                    <select id="goalCategory" required>
                        <option value="">Select Category...</option>
                        <option value="career">Career/Education</option>
                        <option value="health">Health & Fitness</option>
                        <option value="finance">Finance</option>
                        <option value="relationships">Relationships/Social</option>
                        <option value="hobbies">Skills/Hobbies</option>
                    </select>
                    <input 
                        type="date" 
                        id="goalDeadline"
                        title="Set a deadline for this goal"
                    >
                </div>
                <div class="form-row">
                    <div style="flex: 1;"></div>
                    <button type="submit" class="btn btn-primary">Add Goal</button>
                </div>
            </form>
        </div>

        <!-- Goals Display by Category -->
        <div class="goals-container" id="goalsContainer">
            <!-- JavaScript will do its thing -->
        </div>
    </div>

    <script src="supabase-client.js"></script>
    <script src="db.js"></script>
    <script>
        const CATEGORIES = {
            career:        { name: 'Career/Education',     color: 'career' },
            health:        { name: 'Health & Fitness',     color: 'health' },
            finance:       { name: 'Finance',              color: 'finance' },
            relationships: { name: 'Relationships/Social', color: 'relationships' },
            hobbies:       { name: 'Skills/Hobbies',       color: 'hobbies' }
        };

        const XP_PER_GOAL = 50;

        // All goals for the signed-in user (persisted in Supabase via db.js)
        let goals = [];
        // Lifetime number of goals ever completed. Survives deleting goals (stored in lifeAuditGamification).
        let lifetimeCompleted = 0;

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Parse a stored YYYY-MM-DD deadline as a LOCAL date (new Date('YYYY-MM-DD')
        // parses as UTC, which is off by a day in timezones such as Nairobi, UTC+3).
        function parseLocalDate(value) {
            if (!value) return null;
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(value);
            if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
            const d = new Date(value);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatDateDDMMYYYY(value) {
            const date = /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? parseLocalDate(value) : new Date(value);
            if (!date || isNaN(date.getTime())) return '';
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}/${date.getFullYear()}`;
        }

        function showNotification(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.setAttribute('role', 'status');
            toast.style.cssText = `
                position: fixed; top: 20px; right: 20px; z-index: 10000;
                background: ${type === 'error' ? '#b02a2a' : 'var(--black)'}; color: #fff;
                padding: 16px 24px; border-radius: 10px; font-weight: 600; font-size: 14px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: slideIn 0.4s;
                max-width: min(360px, calc(100vw - 40px));
            `;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.4s forwards';
                setTimeout(() => toast.remove(), 400);
            }, type === 'error' ? 5000 : 2800);
        }

        const animStyle = document.createElement('style');
        animStyle.textContent = `
            @keyframes slideIn  { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
            @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(400px); opacity: 0; } }
        `;
        document.head.appendChild(animStyle);

        async function loadUserProfile() {
            const greeting = document.getElementById('userGreeting');
            try {
                const profile = await db.getItem('lifeAuditProfile');
                greeting.textContent = profile && profile.name
                    ? `Welcome, ${profile.name}! Let's organize your goals.`
                    : 'Start by creating your first goal below!';
            } catch (err) {
                console.error('Could not load profile:', err);
                greeting.textContent = 'Start by creating your first goal below!';
            }
        }

        async function loadGoals() {
            try {
                const saved = await db.getItem('lifeAuditGoals');
                goals = Array.isArray(saved) ? saved : [];
            } catch (err) {
                console.error('Could not load goals:', err);
                goals = [];
                showNotification('Could not load your goals. Check your connection and refresh.', 'error');
            }
            try {
                const gam = await db.getItem('lifeAuditGamification');
                lifetimeCompleted = (gam && gam.totalCompleted) || 0;
            } catch (err) {
                console.error('Could not load lifetime counter:', err);
            }
            displayGoals();
            updateStats();
        }

        // Returns true on success so callers can roll back on failure.
        async function saveGoals() {
            try {
                await db.setItem('lifeAuditGoals', goals);
                return true;
            } catch (err) {
                console.error('Could not save goals:', err);
                showNotification('Could not save — your change was not stored. Please try again.', 'error');
                return false;
            }
        }

        // Called once per goal, the first time it is completed. Updates XP and the lifetime counter
        // in a single write so both stay in sync and the counter outlives deleted goals.
        async function recordCompletion(amount, reason) {
            try {
                const existing = await db.getItem('lifeAuditGamification');
                const data = existing || { totalXP: 0, unlockedAchievements: [], streak: 0, lastActiveDate: null };
                data.totalXP = (data.totalXP || 0) + amount;
                // max() should also back-fills users who completed goals before this counter existed
                data.totalCompleted = Math.max((data.totalCompleted || 0) + 1, goals.filter(g => g.completed).length);
                await db.setItem('lifeAuditGamification', data);
                lifetimeCompleted = data.totalCompleted;
                showNotification(`<div style="font-size:22px;">+${amount} XP!</div><div style="font-size:13px;opacity:.9;">${escapeHtml(reason)}</div>`);
            } catch (err) {
                console.error('Could not record completion:', err);
            }
        }

        document.getElementById('goalForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.currentTarget;
            const submitBtn = form.querySelector('button[type="submit"]');

            const title = document.getElementById('goalTitle').value.trim();
            const category = document.getElementById('goalCategory').value;
            const description = document.getElementById('goalDescription').value.trim();
            // <input type="date"> already yields YYYY-MM-DD (or '' when empty)
            const deadline = document.getElementById('goalDeadline').value || null;

            if (!title) { showNotification('Please enter a goal title.', 'error'); return; }
            if (!CATEGORIES[category]) { showNotification('Please choose a category.', 'error'); return; }

            const newGoal = {
                id: Date.now(),
                title,
                category,
                description,
                deadline,
                completed: false,
                createdAt: new Date().toISOString(),
                completedAt: null
            };

            submitBtn.disabled = true;
            goals.push(newGoal);
            const ok = await saveGoals();
            submitBtn.disabled = false;

            if (!ok) { goals.pop(); return; }

            displayGoals();
            updateStats();
            form.reset();
            showNotification('Goal added');
        });

        function displayGoals() {
            const container = document.getElementById('goalsContainer');
            container.innerHTML = '';

            const byCategory = {};
            goals.forEach(g => { (byCategory[g.category] = byCategory[g.category] || []).push(g); });

            Object.keys(CATEGORIES).forEach(key => {
                const category = CATEGORIES[key];
                const categoryGoals = byCategory[key] || [];
                const completedCount = categoryGoals.filter(g => g.completed).length;

                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-icon"></div>
                        <div class="category-title">
                            <h3>${category.name}</h3>
                            <div class="category-count">${completedCount} of ${categoryGoals.length} completed</div>
                        </div>
                        <span class="category-badge category-${category.color}">${categoryGoals.length}</span>
                    </div>
                    <div class="goals-list"></div>
                `;

                const list = section.querySelector('.goals-list');
                if (categoryGoals.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div>No goals in this category yet</div></div>';
                } else {
                    categoryGoals.forEach(goal => list.appendChild(createGoalElement(goal)));
                }
                container.appendChild(section);
            });
        }

        function createGoalElement(goal) {
            const goalDiv = document.createElement('div');
            goalDiv.className = `goal-item ${goal.completed ? 'completed' : ''}`;
            goalDiv.dataset.id = goal.id;

            let deadlineHTML = '';
            const deadline = parseLocalDate(goal.deadline);
            if (deadline) {
                if (goal.completed) {
                    deadlineHTML = `<span style="color:#666;">Completed ${goal.completedAt ? formatDateDDMMYYYY(goal.completedAt) : ''}</span>`;
                } else {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const daysUntil = Math.round((deadline - today) / 86400000);
                    const plural = n => (n === 1 ? 'day' : 'days');

                    if (daysUntil < 0) {
                        deadlineHTML = `<span style="color:#ef4444;font-weight:600;">Overdue by ${-daysUntil} ${plural(-daysUntil)}</span>`;
                    } else if (daysUntil === 0) {
                        deadlineHTML = '<span style="color:#f59e0b;font-weight:600;">Due TODAY</span>';
                    } else if (daysUntil <= 7) {
                        deadlineHTML = `<span style="color:#f59e0b;font-weight:600;">Due in ${daysUntil} ${plural(daysUntil)}</span>`;
                    } else {
                        deadlineHTML = `<span style="color:#666;">Due ${formatDateDDMMYYYY(goal.deadline)}</span>`;
                    }
                }
            }

            goalDiv.innerHTML = `
                <input type="checkbox" class="goal-checkbox" data-action="toggle"
                       aria-label="Mark &quot;${escapeHtml(goal.title)}&quot; as complete" ${goal.completed ? 'checked' : ''}>
                <div class="goal-content">
                    <div class="goal-text">${escapeHtml(goal.title)}</div>
                    ${goal.description ? `<div class="goal-description">${escapeHtml(goal.description)}</div>` : ''}
                    <div class="goal-meta">
                        <span class="goal-date">Added ${formatDateDDMMYYYY(goal.createdAt)}</span>
                        ${deadlineHTML ? `<span class="goal-deadline">${deadlineHTML}</span>` : ''}
                    </div>
                </div>
                <div class="goal-actions">
                    <button type="button" class="icon-btn" data-action="delete"
                            aria-label="Delete goal &quot;${escapeHtml(goal.title)}&quot;" title="Delete">Delete</button>
                </div>
            `;
            return goalDiv;
        }

        document.getElementById('goalsContainer').addEventListener('click', function (e) {
            const actionEl = e.target.closest('[data-action]');
            if (!actionEl) return;
            const item = actionEl.closest('.goal-item');
            if (!item) return;
            const id = Number(item.dataset.id);
            if (actionEl.dataset.action === 'delete') deleteGoal(id);
        });
        document.getElementById('goalsContainer').addEventListener('change', function (e) {
            if (e.target.matches('[data-action="toggle"]')) {
                const item = e.target.closest('.goal-item');
                toggleGoal(Number(item.dataset.id));
            }
        });

        async function toggleGoal(goalId) {
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;

            const before = { completed: goal.completed, completedAt: goal.completedAt, xpAwarded: goal.xpAwarded };
            goal.completed = !goal.completed;
            goal.completedAt = goal.completed ? new Date().toISOString() : null;

            // XP is awarded once per goal: un-ticking and re-ticking can't be farmed for points
            const shouldAward = goal.completed && !goal.xpAwarded;
            if (shouldAward) goal.xpAwarded = true;

            const ok = await saveGoals();
            if (!ok) {
                Object.assign(goal, before);
            } else if (shouldAward) {
                await recordCompletion(XP_PER_GOAL, `Completed: ${goal.title}`);
            }
            displayGoals();
            updateStats();
        }

        async function deleteGoal(goalId) {
            if (!confirm('Are you sure you want to delete this goal?')) return;
            const previous = goals;
            goals = goals.filter(g => g.id !== goalId);
            const ok = await saveGoals();
            if (!ok) goals = previous;
            displayGoals();
            updateStats();
        }

        function updateStats() {
            const total = goals.length;
            const completed = goals.filter(g => g.completed).length;
            document.getElementById('totalGoals').textContent = total;
            document.getElementById('completedGoals').textContent = completed;
            document.getElementById('pendingGoals').textContent = total - completed;
            document.getElementById('allTimeCompleted').textContent = Math.max(lifetimeCompleted, completed);
        }

        window.addEventListener('load', async function () {
            const user = await auth.requireAuth();
            if (!user) return; // redirecting to login
            await loadUserProfile();
            await loadGoals();
        });
    </script>
    <script src="nav.js"></script>
</body>
</html>
