<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="stylesheet" href="styles.css">
<style>
  body.page-login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    padding: 40px 32px;
  }
  .auth-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    margin: 0 0 6px;
    color: var(--black);
  }
  .auth-subtitle {
    color: var(--gray-500);
    font-size: 14px;
    margin: 0 0 28px;
  }
  .auth-field { margin-bottom: 16px; }
  .auth-field label {
    display: block;
    font-size: 12.5px;
    color: var(--gray-700);
    margin-bottom: 6px;
  }
  .auth-field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--gray-200);
    background: var(--gray-50);
    color: var(--black);
    font-size: 14px;
    box-sizing: border-box;
  }
  .auth-field input:focus {
    outline: none;
    border-color: var(--black);
  }
  .auth-submit {
    width: 100%;
    padding: 11px;
    background: var(--black);
    color: var(--white);
    border: 1px solid var(--black);
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }
  .auth-submit:hover { background: var(--gray-700); }
  .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-toggle {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--gray-500);
  }
  .auth-toggle a {
    color: var(--black);
    text-decoration: underline;
  }
  .auth-message {
    font-size: 13px;
    margin-top: 14px;
    padding: 10px 12px;
    display: none;
  }
  .auth-message.error {
    display: block;
    background: #fdf0f0;
    color: #b02a2a;
    border: 1px solid #f0c7c7;
  }
  .auth-message.success {
    display: block;
    background: #f0f7f0;
    color: #2a6b2a;
    border: 1px solid #c7e0c7;
  }
</style>
</head>
<body class="page-login">

  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue to Life Compass.</p>

    <form id="authForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Sign in</button>
    </form>

    <div class="auth-message" id="authMessage"></div>

    <div class="auth-toggle">
      Don't have an account? <a href="life-audit.html">Create one</a>
    </div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="db.js"></script>
  <script>
    const form = document.getElementById('authForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('authMessage');

    window.supabaseReady.then(async () => {
      const user = await db.getUser();
      if (user) window.location.href = 'index.html';
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `auth-message ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      messageEl.className = 'auth-message';

      const { error } = await auth.signIn(email, password);

      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';

      if (error) {
        showMessage(error.message, 'error');
        return;
      }

      // If a signup on life-audit.html finished but couldn't save (email
      // confirmation was pending), pick that profile up now and save it.
      const pending = localStorage.getItem('pendingLifeAuditProfile');
      if (pending) {
        try {
          await db.setItem('lifeAuditProfile', JSON.parse(pending));
          localStorage.removeItem('pendingLifeAuditProfile');
        } catch (err) {
          console.error('Could not save pending profile:', err);
        }
      }

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
