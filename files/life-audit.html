<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Audit System - User Profile</title>
    
</head>
<body class="page-profile">
    <div class="container">

        <div id="welcomeBanner" class="welcome-banner">
            <span id="welcomeText"></span>
            <button id="closeWelcome" class="close-btn">×</button>
        </div>

        <h1>Life Compass</h1>
        <p class="subtitle">Let's Start By Understanding Where You Are in Life</p>

        <div id="successMessage" class="success-message">Profile saved successfully!</div>

        <form id="profileForm">
            <!-- Gather Basic User Information Section -->
            <div class="form-section">
                <h2 class="section-title">Basic Information</h2>
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <!-- set limits to ages ideally use 13 to 120. Realistic lifespan and user not too young at the same time-->
                        <input type="number" id="age" name="age" min="13" max="120" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="non-binary">Non-binary</option>
                            <option value="prefer-not-to-say">Prefer not to say</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="occupation">Current Occupation</label>
                    <input type="text" id="occupation" name="occupation" placeholder="e.g., Software Developer, Student, Entrepreneur" required>
                </div>

                <div class="form-group">
                    <label for="location">City / Town <span style="font-weight: normal; font-size: 0.85em; opacity: 0.7;">— used to tailor local recommendations</span></label>
                    <input type="text" id="location" name="location" placeholder="e.g., Nairobi, Mombasa, Kisumu">
                </div>

                <div class="form-group">
                    <label for="education">Education Level</label>
                    <select id="education" name="education" required>
                        <option value="">Select...</option>
                        <option value="high-school">High School</option>
                        <option value="diploma">Certificate/ Diploma</option>
                        <option value="bachelors">Bachelor's Degree</option>
                        <option value="masters">Master's Degree</option>
                        <option value="phd">PhD/Doctorate</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <!--Get Useer Short and Long Term  Goals Section -->
            <div class="form-section">
                <h2 class="section-title">Your Goals</h2>
                
                <div class="form-group">
                    <label for="shortTermGoals">Short-term Goals (Next 6-12 months)</label>
                    <textarea id="shortTermGoals" name="shortTermGoals" placeholder="Example: Learn Python, Save Some Money, Participate In Marathon" required></textarea>
                </div>

                <div class="form-group">
                    <label for="longTermGoals">Long-term Goals (1-5+ years)</label>
                    <textarea id="longTermGoals" name="longTermGoals" placeholder="Example: Start my own business, Get Married, Travel to 10 countries" required></textarea>
                </div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="btn-primary">Save Profile</button>
                <button type="button" class="btn-secondary" id="loadBtn">Load Saved Profile</button>
            </div>
            
            <!-- Next Button -->
            <div style="margin-top: 25px; text-align: center;">
                <a href="deep-profile.html" class="btn btn-primary" style="display: inline-block; text-decoration: none; padding: 14px 40px; font-size: 16px;">Next: Deep Profile →</a>
            </div>
        </form>
    </div>

    <script>
        

        // Get references to HTML elements we'll work with
        const form = document.getElementById('profileForm');
        const loadBtn = document.getElementById('loadBtn');
        const successMessage = document.getElementById('successMessage');

    
        // FUNCTION 1: Save profile data
        
        form.addEventListener('submit', function(event) {
            // Prevent form from refreshing the page 
            event.preventDefault();
            
            // Create object to store all of form data
            const profileData = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                occupation: document.getElementById('occupation').value,
                location: document.getElementById('location').value,
                education: document.getElementById('education').value,
                shortTermGoals: document.getElementById('shortTermGoals').value,
                longTermGoals: document.getElementById('longTermGoals').value,
                savedDate: new Date().toISOString() // Save when this was created
            };

            // localStorage TOsave data in the browser
            // Only accepts text, so we convert our object to JSON text
            localStorage.setItem('lifeAuditProfile', JSON.stringify(profileData));
            
            showSuccessMessage();
            
            console.log('Profile saved:', profileData); // See it in browser console (F12)
        });

        
        // FUNCTION 2: Load saved profile data
        
        loadBtn.addEventListener('click', function() {
            // Get saved data from localStorage
            const savedData = localStorage.getItem('lifeAuditProfile');
            
            // Section checks if there is actually saved data
            if (savedData) {
                // Convert the JSON text back into a JavaScript object
                const profileData = JSON.parse(savedData);
                
                // Fill in all the form fields with the saved data
                document.getElementById('name').value = profileData.name;
                document.getElementById('age').value = profileData.age;
                document.getElementById('gender').value = profileData.gender;
                document.getElementById('occupation').value = profileData.occupation;
                document.getElementById('location').value = profileData.location || '';
                document.getElementById('education').value = profileData.education;
                document.getElementById('shortTermGoals').value = profileData.shortTermGoals;
                document.getElementById('longTermGoals').value = profileData.longTermGoals;
                
                showSuccessMessage('Profile loaded successfully!');
            } else {
                // No saved data found
                alert('No saved profile found. Please fill out and save your profile first.');
            }
        });

        
        // FUNCTION 3: Success message
        
        function showSuccessMessage(message = ' Profile saved successfully!') {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            
            // To hide the message after 3 seconds
            setTimeout(function() {
                successMessage.classList.remove('show');
            }, 3000);
        }

        
        // Auto-load profile when page loads
        
        // This section automatically shows a welcome message to areturning user
        window.addEventListener('load', function() {
            const savedData = localStorage.getItem('lifeAuditProfile');
            if (savedData) {
                const profileData = JSON.parse(savedData);
                showWelcomeMessage(profileData.name);
                console.log('Found saved profile! Click "Load Saved Profile" to restore it.');
            }
        });

        
        // FUNCTION 4: Display our welcome banner
        
        function showWelcomeMessage(name) {
            const welcomeBanner = document.getElementById('welcomeBanner');
            const welcomeText = document.getElementById('welcomeText');
            
            // Array fun greeting messages
            const greetings = [
                `Welcome back, ${name}! Ready to crush your goals? `,
                `${name} returns! Let's make today count! `,
                `Hey ${name}! Your future self will thank you for being here! `,
                `Look who's back! Let's do this, ${name}! `,
                `${name} is in the house! Time to level up! `,
                `Great to see you again, ${name}! Let's audit that life! `,
                `${name} has entered the chat! Goal-crushing mode= ON `
            ];
            
            // Pick random greeting
            const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
            
            welcomeText.textContent = randomGreeting;
            welcomeBanner.classList.add('show');
        }

        // FUNCTION 5: Close welcome banner
    
        document.getElementById('closeWelcome').addEventListener('click', function() {
            document.getElementById('welcomeBanner').classList.remove('show');
        });
    </script>
</body>
</html>
