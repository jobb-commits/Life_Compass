<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    
</head>
<body class="page-profile">
    <div class="container">

        <div id="welcomeBanner" class="welcome-banner">
            <span id="welcomeText"></span>
            <button id="closeWelcome" class="close-btn">×</button>
        </div>

        <h1>Life Compass</h1>
        <p class="subtitle">Let's Start By Understanding Where You Are in Life</p>

        <div id="successMessage" class="success-message">Profile saved successfully!</div>
        <div id="authMessage" class="success-message" style="display:none;"></div>

        <form id="profileForm">
            <div class="form-section" id="accountSection">
                <h2 class="section-title">Your Account</h2>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" autocomplete="new-password">
                </div>

                <p style="font-size: 0.85em; opacity: 0.7;">
                    Already have an account? <a href="login.html">Sign in</a> instead.
                </p>
            </div>

            <div id="signedInAs" style="display:none; font-size: 0.9em; opacity: 0.75; margin-bottom: 20px;"></div>

            <div class="form-section">
                <h2 class="section-title">Basic Information</h2>
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" min="13" max="120" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="non-binary">Non-binary</option>
                            <option value="prefer-not-to-say">Prefer not to say</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="occupation">Current Occupation</label>
                    <input type="text" id="occupation" name="occupation" placeholder="e.g., Student, Software Developer, Entrepreneur" required>
                </div>

                <div class="form-group">
                    <label for="location">City / Town <span style="font-weight: normal; font-size: 0.85em; opacity: 0.7;">optional but used to tailor local recommendations</span></label>
                    <input type="text" id="location" name="location" placeholder="e.g., Nairobi, Mombasa, Nakuru">
                </div>

                <div class="form-group">
                    <label for="education">Education Level</label>
                    <select id="education" name="education" required>
                        <option value="">Select...</option>
                        <option value="high-school">High School</option>
                        <option value="diploma">Certificate/ Diploma</option>
                        <option value="bachelors">Bachelor's Degree</option>
                        <option value="masters">Master's Degree</option>
                        <option value="phd">PhD/Doctorate</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">Your Goals</h2>
                
                <div class="form-group">
                    <label for="shortTermGoals">Short-term Goals (Next 6-12 months)</label>
                    <textarea id="shortTermGoals" name="shortTermGoals" placeholder="Example: Learn Python, Save Some Money, Participate In Marathon" required></textarea>
                </div>

                <div class="form-group">
                    <label for="longTermGoals">Long-term Goals (In 1-5+ years)</label>
                    <textarea id="longTermGoals" name="longTermGoals" placeholder="Example: Start my own business, Get Married, Travel to 10 countries" required></textarea>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary" id="submitBtn">Sign Up &amp; Save Profile</button>
            </div>
            
            <div style="margin-top: 25px; text-align: center;">
                <a href="deep-profile.html" class="btn btn-primary" style="display: inline-block; text-decoration: none; padding: 14px 40px; font-size: 16px;">Next: Deep Profile →</a>
            </div>
        </form>
    </div>

    <script src="supabase-client.js"></script>
    <script src="db.js"></script>
    <script>
        
        const form = document.getElementById('profileForm');
        const successMessage = document.getElementById('successMessage');
        const authMessage = document.getElementById('authMessage');
        const accountSection = document.getElementById('accountSection');
        const signedInAs = document.getElementById('signedInAs');
        const submitBtn = document.getElementById('submitBtn');

        function getFormProfileData() {
            return {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                occupation: document.getElementById('occupation').value,
                location: document.getElementById('location').value,
                education: document.getElementById('education').value,
                shortTermGoals: document.getElementById('shortTermGoals').value,
                longTermGoals: document.getElementById('longTermGoals').value,
                savedDate: new Date().toISOString()
            };
        }

        function fillForm(profileData) {
            document.getElementById('name').value = profileData.name || '';
            document.getElementById('age').value = profileData.age || '';
            document.getElementById('gender').value = profileData.gender || '';
            document.getElementById('occupation').value = profileData.occupation || '';
            document.getElementById('location').value = profileData.location || '';
            document.getElementById('education').value = profileData.education || '';
            document.getElementById('shortTermGoals').value = profileData.shortTermGoals || '';
            document.getElementById('longTermGoals').value = profileData.longTermGoals || '';
        }

        // FUNCTION 1: Save/sign-up handler
        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const profileData = getFormProfileData();
            const currentUser = await db.getUser();

            if (currentUser) {
                // Already signed in: just save the profile.
                submitBtn.disabled = true;
                submitBtn.textContent = 'Saving…';
                try {
                    await db.setItem('lifeAuditProfile', profileData);
                    showSuccessMessage();
                } catch (err) {
                    showAuthMessage(err.message, true);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Save Profile';
                }
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAuthMessage('Please enter an email and password to create your account.', true);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing up…';

            const { data, error } = await auth.signUp(email, password);

            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign Up & Save Profile';

            if (error) {
                showAuthMessage(error.message, true);
                return;
            }

            if (data.session) {
                await db.setItem('lifeAuditProfile', profileData);
                showSuccessMessage();
                window.location.href = 'deep-profile.html';
            } else {
                localStorage.setItem('pendingLifeAuditProfile', JSON.stringify(profileData));
                showAuthMessage('Check your email to confirm your account, then sign in to finish setting up your profile.', false);
            }
        });

        // FUNCTION 2: Success message helpers
        function showSuccessMessage(message = ' Profile saved successfully!') {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(function() {
                successMessage.classList.remove('show');
            }, 3000);
        }

        function showAuthMessage(message, isError) {
            authMessage.textContent = message;
            authMessage.style.display = 'block';
            authMessage.style.background = isError ? '#fdf0f0' : '';
            authMessage.style.color = isError ? '#b02a2a' : '';
        }


        window.addEventListener('load', async function() {
            const user = await db.getUser();

            if (user) {
                accountSection.style.display = 'none';
                document.getElementById('email').removeAttribute('required');
                document.getElementById('password').removeAttribute('required');
                signedInAs.style.display = 'block';
                signedInAs.textContent = `Signed in as ${user.email}`;
                submitBtn.textContent = 'Save Profile';

                const profileData = await db.getItem('lifeAuditProfile');
                if (profileData) {
                    fillForm(profileData);
                    showWelcomeMessage(profileData.name);
                }
            }
        });

        
        // FUNCTION 4: Display dynamic welcome banner
        
        function showWelcomeMessage(name) {
            const welcomeBanner = document.getElementById('welcomeBanner');
            const welcomeText = document.getElementById('welcomeText');
            
            // Array of 'fun' greeting messages
            const greetings = [
                `Welcome back, ${name}! Ready to crush your goals? `,
                `${name} returns! Let's make today count! `,
                `Hey ${name}! Your future self will thank you for being here! `,
                `Look who's back! Let's do this, ${name}! `,
                `${name} is in the house! Time to level up! `,
                `Great to see you again, ${name}! Let's audit that life! `,
                `${name} has entered the chat! Goal-crushing mode= ON `
            ];
            
            // Pick random greeting
            const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
            
            welcomeText.textContent = randomGreeting;
            welcomeBanner.classList.add('show');
        }

        // FUNCTION 5: Close welcome banner
    
        document.getElementById('closeWelcome').addEventListener('click', function() {
            document.getElementById('welcomeBanner').classList.remove('show');
        });
    </script>
</body>
</html>
