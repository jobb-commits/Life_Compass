<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Compass- Timeline & Milestones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Your Life Timeline</h1>
            <p class="user-info" id="userInfo">Personalized milestones based on your age</p>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="currentAge">--</div>
                <div class="stat-label">Current Age</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="milestonesAhead">--</div>
                <div class="stat-label">Milestones Ahead</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="nextMilestone">--</div>
                <div class="stat-label">Years to Next</div>
            </div>
        </div>

        <div class="current-stage">
            <div class="stage-icon" id="stageIcon"></div>
            <h2 id="stageName">Loading...</h2>
            <p class="stage-description" id="stageDescription"></p>
            <span class="age-range" id="ageRange"></span>
        </div>

        <div class="recommendations-section">
            <h2>Recommended Focus Areas for Your Age</h2>
            <div class="recommendation-grid" id="recommendationsGrid">
            </div>
        </div>

        <div class="timeline-section">
            <h2>Life Milestones Roadmap</h2>
            <div class="timeline" id="timeline">
            </div>
        </div>
    </div>

    <script>
        
        // LIFE STAGES DEFINITIONS
        
        const LIFE_STAGES = [
            {
                name: 'Young Adult',
                ageRange: [18, 24],
                description: 'A time for exploration, learning, and building foundations. Focus on education, skill development, and discovering your passions.',
                recommendations: [
                    { category: 'CAREER', text: 'Explore different career paths through internships and entry-level positions', tip: 'Try at least 2-3 different industries' },
                    { category: 'EDUCATION', text: 'Invest in learning - whether formal education or self-taught skills', tip: 'The skills you build now compound over time' },
                    { category: 'FINANCE', text: 'Start building good money habits and emergency savings', tip: 'Aim for 3-6 months of expenses saved' },
                    { category: 'RELATIONSHIPS', text: 'Build meaningful friendships and network', tip: 'Quality over quantity in relationships' }
                ]
            },
            {
                name: 'Building Years',
                ageRange: [25, 34],
                description: 'Time to establish your career, relationships, and financial foundation. Major life decisions often happen during this decade.',
                recommendations: [
                    { category: 'CAREER', text: 'Establish yourself in your chosen field and aim for mid-level positions', tip: 'Specialize but keep learning adjacent skills' },
                    { category: 'FINANCE', text: 'Start serious retirement planning and consider investments', tip: 'Target saving 20% of income if possible' },
                    { category: 'LIFE', text: 'Consider long-term living arrangements and major purchases', tip: 'Buy assets, not liabilities' },
                    { category: 'HEALTH', text: 'Establish sustainable fitness and health routines', tip: 'The habits you build now last a lifetime' }
                ]
            },
            {
                name: 'Prime Years',
                ageRange: [35, 44],
                description: 'Peak earning and productivity years. Balance ambition with well-being and family life.',
                recommendations: [
                    { category: 'CAREER', text: 'Reach for leadership positions and maximize earnings', tip: 'Mentor others as you climb' },
                    { category: 'FINANCE', text: 'Aggressive wealth building - investments, retirement, college funds', tip: 'Your income should be peaking' },
                    { category: 'FAMILY', text: 'Balance family responsibilities with career growth', tip: 'Time with loved ones is irreplaceable' },
                    { category: 'PURPOSE', text: 'Refine your life purpose and legacy goals', tip: 'What impact do you want to make?' }
                ]
            },
            {
                name: 'Mastery Phase',
                ageRange: [45, 54],
                description: 'Leverage your experience and wisdom. Focus on impact, mentorship, and preparation for the next chapter.',
                recommendations: [
                    { category: 'CAREER', text: 'Share expertise through teaching, consulting, or leadership', tip: 'Your experience is valuable' },
                    { category: 'FINANCE', text: 'Maximize retirement contributions and review investment strategy', tip: 'Retirement is closer than you think' },
                    { category: 'HEALTH', text: 'Prioritize preventative health and maintain fitness', tip: 'Health investments pay huge dividends' },
                    { category: 'GROWTH', text: 'Explore new interests and personal development', tip: "You're never too old to learn" }
                ]
            },
            {
                name: 'Transition Years',
                ageRange: [55, 64],
                description: 'Prepare for retirement while staying engaged. This is a bridge between career and retirement.',
                recommendations: [
                    { category: 'FINANCE', text: 'Finalize retirement plans and transition to safer investments', tip: 'Calculate your retirement number' },
                    { category: 'PURPOSE', text: 'Plan what gives you meaning beyond career', tip: 'Retirement is to something, not from something' },
                    { category: 'RELATIONSHIPS', text: 'Strengthen bonds with family and friends', tip: 'Relationships matter more than ever' },
                    { category: 'HEALTH', text: 'Stay active and manage any chronic conditions', tip: 'Physical activity is key to longevity' }
                ]
            },
            {
                name: 'Golden Years',
                ageRange: [65, 100],
                description: 'Time to enjoy the fruits of your labor, give back, and focus on what truly matters.',
                recommendations: [
                    { category: 'LIFE', text: 'Pursue hobbies, travel, and experiences you love', tip: "Do what makes you happy" },
                    { category: 'LEGACY', text: 'Share wisdom with younger generations', tip: 'Your story matters' },
                    { category: 'HEALTH', text: 'Stay as active as possible and maintain social connections', tip: 'Motion is life' },
                    { category: 'GIVING', text: 'Consider how to give back to your community', tip: 'Leave the world better than you found it' }
                ]
            }
        ];
        
        // MILESTONE DEFINITIONS        
        const MILESTONES = [
            { age: 18, title: 'Adulthood Begins', description: 'Finish high school, start college or career, gain independence' },
            { age: 21, title: 'Full Independence', description: 'Complete legal adulthood, make your own decisions' },
            { age: 25, title: 'Quarter Life', description: 'Career foundation, first serious relationships, financial basics' },
            { age: 30, title: 'The Big Three-O', description: 'Career established, consider major life commitments' },
            { age: 35, title: 'Mid-Thirties Peak', description: 'Peak earning potential begins, leadership roles' },
            { age: 40, title: 'Life Assessment', description: 'Evaluate achievements, adjust course if needed' },
            { age: 45, title: 'Midlife Wisdom', description: 'Maximum career impact, mentorship opportunities' },
            { age: 50, title: 'Half Century', description: 'Experience and expertise peak, prepare for transition' },
            { age: 55, title: 'Pre-Retirement', description: 'Retirement planning intensifies, legacy building' },
            { age: 60, title: 'Retirement Prep', description: 'Final career phase, transition planning' },
            { age: 65, title: 'Retirement Begins',description: 'Traditional retirement age, new chapter begins' },
            { age: 70, title: 'Golden Milestone', description: 'Wisdom years, focus on joy and legacy' },
            { age: 75, title: 'Three-Quarter Century', description: 'Celebrate longevity, share experiences' },
            { age: 80, title: 'Octogenarian', description: 'Living history, family patriarch/matriarch' }
        ];

        let userAge = 0;
        let currentStage = null;

        
        // FUNCTION 1: Load user data
        
        function loadData() {
            const savedProfile = localStorage.getItem('lifeAuditProfile');
            
            if (savedProfile) {
                const profile = JSON.parse(savedProfile);
                userAge = parseInt(profile.age);
                
                document.getElementById('userInfo').textContent = 
                    `${profile.name}, Age ${userAge} - Your personalized roadmap`;
                
                // Find current life stage
                currentStage = LIFE_STAGES.find(stage => 
                    userAge >= stage.ageRange[0] && userAge <= stage.ageRange[1]
                );

                updateStats();
                displayCurrentStage();
                displayRecommendations();
                displayTimeline();
            } else {
                document.getElementById('userInfo').textContent = 
                    'Please complete your profile first to see personalized milestones';
            }
        }

        
        // FUNCTION 2: Update stats
        
        function updateStats() {
            document.getElementById('currentAge').textContent = userAge;
            
            // Count milestones ahead
            const milestonesAhead = MILESTONES.filter(m => m.age > userAge).length;
            document.getElementById('milestonesAhead').textContent = milestonesAhead;
            
            // Next milestone
            const nextMilestone = MILESTONES.find(m => m.age > userAge);
            if (nextMilestone) {
                const yearsToNext = nextMilestone.age - userAge;
                document.getElementById('nextMilestone').textContent = yearsToNext;
            } else {
                document.getElementById('nextMilestone').textContent = '--';
            }
        }

        
        // FUNCTION 3: Display current life stage
        
        function displayCurrentStage() {
            if (!currentStage) return;

            document.getElementById('stageName').textContent = currentStage.name;
            document.getElementById('stageDescription').textContent = currentStage.description;
            document.getElementById('ageRange').textContent = 
                `Ages ${currentStage.ageRange[0]} - ${currentStage.ageRange[1]}`;
        }

        
        // FUNCTION 4: Display recommendations
        
        function displayRecommendations() {
            if (!currentStage) return;

            const grid = document.getElementById('recommendationsGrid');
            grid.innerHTML = '';

            currentStage.recommendations.forEach(rec => {
                const card = document.createElement('div');
                card.className = 'recommendation-card';
                card.innerHTML = `
                    <div class="recommendation-category">${rec.category}</div>
                    <div class="recommendation-text">${rec.text}</div>
                    <div class="recommendation-tip">${rec.tip}</div>
                `;
                grid.appendChild(card);
            });
        }

        
        // FUNCTION 5: Display timeline
        
        function displayTimeline() {
                        const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            // Filter milestones to show (past 2, current range, next 5)
            const relevantMilestones = MILESTONES.filter(m => {
                return (m.age >= userAge - 10 && m.age <= userAge + 20) || 
                       (m.age > userAge && m.age <= userAge + 30);
            });

            relevantMilestones.forEach(milestone => {
                const isPast = milestone.age < userAge;
                const isCurrent = milestone.age === userAge || 
                                (milestone.age > userAge && milestone.age <= userAge + 5);
                
                const item = document.createElement('div');
                item.className = `timeline-item ${isPast ? 'past' : ''} ${isCurrent && !isPast ? 'current' : ''}`;
                
                item.innerHTML = `
                    <div class="timeline-content">
                        <div class="milestone-age">Age ${milestone.age}</div>
                        <div class="milestone-title">${milestone.title}</div>
                        <div class="milestone-description">${milestone.description}</div>
                    </div>
                    <div class="timeline-dot"></div>
                `;
                
                timeline.appendChild(item);
            });
        }

        
        window.addEventListener('load', function() {
            loadData();
        });
    </script>
      <script src="nav.js"></script>
</body>
</html>
