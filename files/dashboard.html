<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Compass - Progress Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>Progress Dashboard</h1>
            <p class="user-greeting" id="userGreeting">Visualize your journey</p>
        </div>

        <div class="overall-progress">
            <h2>Overall Progress</h2>
            
            <!-- Circular progress gauge with animated ring -->
            <div class="circular-progress">
                <svg class="progress-ring" width="200" height="200">
                    <circle
                        stroke="var(--gray-200)"
                        stroke-width="20"
                        fill="transparent"
                        r="80"
                        cx="100"
                        cy="100"
                    />
                    <circle
                        class="progress-ring-circle"
                        stroke-width="20"
                        fill="transparent"
                        r="80"
                        cx="100"
                        cy="100"
                        id="progressCircle"
                    />
                </svg>
                <div class="progress-text" id="progressPercentage">0%</div>
                <div class="progress-label">Complete</div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="totalGoalsStat">0</div>
                    <div class="stat-label">Total Goals</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="completedStat">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="inProgressStat">0</div>
                    <div class="stat-label">In Progress</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="completionRate">0%</div>
                    <div class="stat-label">Success Rate</div>
                </div>
            </div>
        </div>

        <div class="category-progress-section">
            <h2>Progress by Category</h2>
            <div class="category-progress-list" id="categoryProgressList">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <div class="comparison-chart">
            <h2>Goals Distribution</h2>
            <div class="bar-chart" id="barChart">
            </div>
        </div>

        <div class="recent-activity">
            <h2>Recent Activity</h2>
            <div class="activity-list" id="activityList">
            </div>
        </div>
    </div>

    <script>
        
        // Category definitions 
        const CATEGORIES = {
            career: { name: 'Career/Education', color: 'career' },    
            health: { name: 'Health & Fitness', color: 'health' },     
            finance: { name: 'Finance', color: 'finance' },            
            relationships: { name: 'Relationships/Social', color: 'relationships' }, 
            hobbies: { name: 'Skills/Hobbies', color: 'hobbies' }     
        };

        let goals = [];

        // FUNCTION 1: Load data and initialize dashboard
        function loadData() {
            const savedProfile = localStorage.getItem('lifeAuditProfile');
            if (savedProfile) {
                try {
                    const profile = JSON.parse(savedProfile);
                    if (profile.name) {
                        document.getElementById('userGreeting').textContent = 
                            `${profile.name}'s Progress Overview`;
                    } else {
                        document.getElementById('userGreeting').textContent = 
                            'Complete your profile to personalize this dashboard';
                    }
                } catch (e) {
                    console.error('Error parsing profile data:', e);
                    document.getElementById('userGreeting').textContent = 
                        'Dashboard loaded - profile data could not be parsed';
                }
            } else {
                document.getElementById('userGreeting').textContent = 
                    'Complete your profile to personalize this dashboard';
            }

            // Load goals
            const savedGoals = localStorage.getItem('lifeAuditGoals');
            try {
                goals = savedGoals ? JSON.parse(savedGoals) : [];
            } catch (e) {
                console.error('Error parsing goals data:', e);
                goals = [];
            }

            // Update visualizations
            updateOverallProgress();
            updateCategoryProgress();
            updateComparisonChart();
            updateRecentActivity();
        }

    
        // FUNCTION 2: Update circular progress gauge
        
        function updateOverallProgress() {
            const total = goals.length;
            const completed = goals.filter(g => g.completed).length;
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

            // Update percentage text
            document.getElementById('progressPercentage').textContent = percentage + '%';

            // Update stats
            document.getElementById('totalGoalsStat').textContent = total;
            document.getElementById('completedStat').textContent = completed;
            document.getElementById('inProgressStat').textContent = total - completed;
            document.getElementById('completionRate').textContent = percentage + '%';

            const circle = document.getElementById('progressCircle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;

            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = circumference;

            // Small delay triggers CSS transition animation (set in styles.css)
            const ANIMATION_DELAY = 100;  // milliseconds
            setTimeout(() => {
                const offset = circumference - (percentage / 100) * circumference;
                circle.style.strokeDashoffset = offset;
            }, ANIMATION_DELAY);
        }

        
        // FUNCTION 3: Update progress bars
        
        function updateCategoryProgress() {
            const container = document.getElementById('categoryProgressList');
            container.innerHTML = '';

            Object.keys(CATEGORIES).forEach(categoryKey => {
                const category = CATEGORIES[categoryKey];
                const categoryGoals = goals.filter(g => g.category === categoryKey);
                const total = categoryGoals.length;
                const completed = categoryGoals.filter(g => g.completed).length;
                const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

                const item = document.createElement('div');
                item.className = 'category-progress-item';
                item.innerHTML = `
                    <div class="category-info">
                        <div class="category-name">${category.name}</div>
                        <div class="category-stats">${completed} of ${total} complete</div>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill progress-bar-${category.color}" 
                             role="progressbar" 
                             aria-valuenow="${percentage}" 
                             aria-valuemin="0" 
                             aria-valuemax="100"
                             aria-label="${category.name}: ${percentage}% complete (${completed} of ${total} goals)"
                             style="width: ${percentage}%">${percentage > 10 ? percentage + '%' : ''}</div>
                    </div>
                `;

                container.appendChild(item);
            });
        }

        
        // FUNCTION 4: Update comparison bar chart
        
        function updateComparisonChart() {
            const container = document.getElementById('barChart');
            container.innerHTML = '';

            // Find max goals for scaling
            const maxGoals = Math.max(...Object.keys(CATEGORIES).map(key => 
                goals.filter(g => g.category === key).length
            ), 1);

            Object.keys(CATEGORIES).forEach(categoryKey => {
                const category = CATEGORIES[categoryKey];
                const count = goals.filter(g => g.category === categoryKey).length;
                const heightPercentage = (count / maxGoals) * 100;

                const column = document.createElement('div');
                column.className = 'bar-column';
                column.innerHTML = `
                    <div class="bar" style="height: ${heightPercentage}%">
                        <div class="bar-value">${count}</div>
                    </div>
	                    <div class="bar-label">${category.name.split('/')[0]}</div>
                `;

                container.appendChild(column);
            });
        }
        
        // FUNCTION 5: Update recent activity feed        
        function updateRecentActivity() {
            const container = document.getElementById('activityList');
            container.innerHTML = '';

            // Configurable recent activity limit
            const RECENT_ACTIVITY_LIMIT = 5;

	            if (goals.length === 0) {
	                container.innerHTML = `
	                    <div class="empty-state">
	                        <div>No goals yet. Start adding goals to see activity here!</div>
	                    </div>
	                `;
	                return;
	            }

            // Sort goals (newest first)
            const sortedGoals = [...goals].sort((a, b) => 
                new Date(b.createdAt) - new Date(a.createdAt)
            );

            // Show last N activities
            const recentGoals = sortedGoals.slice(0, RECENT_ACTIVITY_LIMIT);

            recentGoals.forEach(goal => {
                const category = CATEGORIES[goal.category];
                const date = new Date(goal.createdAt);
                const timeAgo = getTimeAgo(date);
                
                // Show completion status if goal is completed
                let statusIcon = category.name.split('/')[0].slice(0, 1);
                let statusText = `Created ${timeAgo}`;
                
                if (goal.completed) {
                    statusIcon = '✓';
                    statusText = 'Completed';
                }

                const item = document.createElement('div');
                item.className = `activity-item ${goal.completed ? 'completed' : ''}`;
	                item.innerHTML = `
	                    <div class="activity-icon" title="${goal.completed ? 'Completed' : 'In Progress'}">${statusIcon}</div>
	                    <div class="activity-content">
	                        <div class="activity-text">${goal.title}</div>
	                        <div class="activity-time">${statusText} • ${category.name}</div>
	                    </div>
	                `;

                container.appendChild(item);
            });
        }
        
        // FUNCTION 6: Calculate 'time ago' text
        // Uses named constants for clarity and maintainability
        function getTimeAgo(date) {
            const now = new Date();
            const secondsAgo = Math.floor((now - date) / 1000);

            // Define time units in seconds
            const MINUTE = 60;
            const HOUR = 60 * MINUTE;
            const DAY = 24 * HOUR;
            const WEEK = 7 * DAY;
            const MONTH = 30 * DAY;
            const YEAR = 365 * DAY;

            if (secondsAgo < MINUTE) return 'Just now';
            if (secondsAgo < HOUR) return Math.floor(secondsAgo / MINUTE) + ' minute' + (Math.floor(secondsAgo / MINUTE) !== 1 ? 's' : '') + ' ago';
            if (secondsAgo < DAY) return Math.floor(secondsAgo / HOUR) + ' hour' + (Math.floor(secondsAgo / HOUR) !== 1 ? 's' : '') + ' ago';
            if (secondsAgo < WEEK) return Math.floor(secondsAgo / DAY) + ' day' + (Math.floor(secondsAgo / DAY) !== 1 ? 's' : '') + ' ago';
            if (secondsAgo < MONTH) return Math.floor(secondsAgo / WEEK) + ' week' + (Math.floor(secondsAgo / WEEK) !== 1 ? 's' : '') + ' ago';
            if (secondsAgo < YEAR) return Math.floor(secondsAgo / MONTH) + ' month' + (Math.floor(secondsAgo / MONTH) !== 1 ? 's' : '') + ' ago';
            
            // Use ISO format for very old dates (consistent with rest of app)
            return date.toISOString().split('T')[0];
        }

        // Load everything when page loads        
        window.addEventListener('load', function() {
            loadData();
        });
    </script>
    <script src="nav.js"></script>
</body>
</html>
