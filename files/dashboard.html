<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Compass - Progress Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>Progress Dashboard</h1>
            <p class="user-greeting" id="userGreeting">Visualize your journey</p>
        </div>

        <div class="overall-progress">
            <h2>Overall Progress</h2>
            
            <!-- Progress Gauge Will Appear Cyclic Hopefully. Works well on desktop, yet to test on mobile devices -->
             <!-- Improved mobile phone compatibility on css a little-->
            <div class="circular-progress">
                <canvas id="progressChart" width="200" height="200"></canvas>
                <div class="progress-text" id="progressPercentage">0%</div>
                <div class="progress-label">Complete</div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="totalGoalsStat">0</div>
                    <div class="stat-label">Total Goals</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="completedStat">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="inProgressStat">0</div>
                    <div class="stat-label">In Progress</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="completionRate">0%</div>
                    <div class="stat-label">Success Rate</div>
                </div>
            </div>
        </div>

        <div class="category-progress-section">
            <h2>Progress by Category</h2>
            <div class="category-progress-list" id="categoryProgressList">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <div class="comparison-chart">
            <h2>Goals Distribution</h2>
            <canvas id="distributionChart" height="220"></canvas>
        </div>

        <div class="recent-activity">
            <h2>Recent Activity</h2>
            <div class="activity-list" id="activityList">
            </div>
        </div>
    </div>

    <script>
        
        // Category definitions (our constants)
        const CATEGORIES = {
            career: { name: 'Career/Education', color: 'career' },
            health: { name: 'Health & Fitness', color: 'health' },
            finance: { name: 'Finance', color: 'finance' },
            relationships: { name: 'Relationships/Social', color: 'relationships' },
            hobbies: { name: 'Skills/Hobbies', color: 'hobbies' }
        };

        let goals = [];
        let progressChart = null;
        let distributionChart = null;

        // FUNCTION 1: Load data and initialize dashboard
        function loadData() {
            // Load user profile
            const savedProfile = localStorage.getItem('lifeAuditProfile');
            if (savedProfile) {
                const profile = JSON.parse(savedProfile);
                document.getElementById('userGreeting').textContent = 
                    `${profile.name}'s Progress Overview`;
            }

            // Load goals
            const savedGoals = localStorage.getItem('lifeAuditGoals');
            goals = savedGoals ? JSON.parse(savedGoals) : [];

            // Update visualizations
            updateOverallProgress();
            updateCategoryProgress();
            updateComparisonChart();
            updateRecentActivity();
        }

    
        // FUNCTION 2: Update circular progress gauge (Chart.js doughnut)
        
        function updateOverallProgress() {
            const total = goals.length;
            const completed = goals.filter(g => g.completed).length;
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

            // Update percentage text
            document.getElementById('progressPercentage').textContent = percentage + '%';

            // Update stats
            document.getElementById('totalGoalsStat').textContent = total;
            document.getElementById('completedStat').textContent = completed;
            document.getElementById('inProgressStat').textContent = total - completed;
            document.getElementById('completionRate').textContent = percentage + '%';

            const ctx = document.getElementById('progressChart').getContext('2d');

            if (progressChart) {
                progressChart.data.datasets[0].data = [percentage, 100 - percentage];
                progressChart.update();
                return;
            }

            progressChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Complete', 'Remaining'],
                    datasets: [{
                        data: [percentage, 100 - percentage],
                        backgroundColor: ['#0a0a0a', '#e5e5e5'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '80%',
                    responsive: false,
                    animation: { animateRotate: true, duration: 700 },
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    }
                }
            });
        }

        
        // FUNCTION 3: Update progress bars
        
        function updateCategoryProgress() {
            const container = document.getElementById('categoryProgressList');
            container.innerHTML = '';

            Object.keys(CATEGORIES).forEach(categoryKey => {
                const category = CATEGORIES[categoryKey];
                const categoryGoals = goals.filter(g => g.category === categoryKey);
                const total = categoryGoals.length;
                const completed = categoryGoals.filter(g => g.completed).length;
                const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

                const item = document.createElement('div');
                item.className = 'category-progress-item';
                item.innerHTML = `
                    <div class="category-info">
	                        <div class="category-name">
	                            <span>${category.name}</span>
	                        </div>
                        <div class="category-stats">${completed} of ${total} complete</div>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill progress-bar-${category.color}" 
                             style="width: ${percentage}%">${percentage > 10 ? percentage + '%' : ''}</div>
                    </div>
                `;

                container.appendChild(item);
            });
        }

        
        // FUNCTION 4: Update comparison bar chart (Chart.js stacked bar)
        
        function updateComparisonChart() {
            const labels = Object.keys(CATEGORIES).map(key => CATEGORIES[key].name.split('/')[0]);
            const completedData = Object.keys(CATEGORIES).map(key =>
                goals.filter(g => g.category === key && g.completed).length
            );
            const remainingData = Object.keys(CATEGORIES).map(key =>
                goals.filter(g => g.category === key && !g.completed).length
            );

            const ctx = document.getElementById('distributionChart').getContext('2d');

            if (distributionChart) {
                distributionChart.data.datasets[0].data = completedData;
                distributionChart.data.datasets[1].data = remainingData;
                distributionChart.update();
                return;
            }

            distributionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        { label: 'Completed', data: completedData, backgroundColor: '#0a0a0a', stack: 'goals' },
                        { label: 'Remaining', data: remainingData, backgroundColor: '#d0d0d0', stack: 'goals' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false } },
                        y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                    }
                }
            });
        }
        
        // FUNCTION 5: Update recent activity feed        
        function updateRecentActivity() {
            const container = document.getElementById('activityList');
            container.innerHTML = '';

	            if (goals.length === 0) {
	                container.innerHTML = `
	                    <div class="empty-state">
	                        <div>No activity yet. Start adding goals!</div>
	                    </div>
	                `;
	                return;
	            }

            // Sort goals (newest first)
            const sortedGoals = [...goals].sort((a, b) => 
                new Date(b.createdAt) - new Date(a.createdAt)
            );

            // Show last 5 activities
            const recentGoals = sortedGoals.slice(0, 5);

            recentGoals.forEach(goal => {
                const category = CATEGORIES[goal.category];
                const date = new Date(goal.createdAt);
                const timeAgo = getTimeAgo(date);

                const item = document.createElement('div');
                item.className = 'activity-item';
	                item.innerHTML = `
	                    <div class="activity-icon">${category.name.split('/')[0].slice(0, 1)}</div>
	                    <div class="activity-content">
	                        <div class="activity-text">${goal.title}</div>
	                        <div class="activity-time">${timeAgo} • ${category.name}</div>
	                    </div>
	                `;

                container.appendChild(item);
            });
        }
        
        // FUNCTION 6: Calculate 'time ago' text        
        function getTimeAgo(date) {
            const now = new Date();
            const secondsAgo = Math.floor((now - date) / 1000);

            if (secondsAgo < 60) return 'Just now';
            if (secondsAgo < 3600) return Math.floor(secondsAgo / 60) + ' minutes ago';
            if (secondsAgo < 86400) return Math.floor(secondsAgo / 3600) + ' hours ago';
            if (secondsAgo < 604800) return Math.floor(secondsAgo / 86400) + ' days ago';
            
            return date.toLocaleDateString();
        }

        // Load everything when page loads        
        window.addEventListener('load', function() {
            loadData();
        });
    </script>
    <script src="nav.js"></script>
</body>
</html>
